# nginx.conf - Configuración para el Búnker PromptVault
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimización para hardware local
    sendfile        on;
    keepalive_timeout  65;
    server_tokens off; # Oculta la versión de Nginx por seguridad

    # Compresión Gzip para ahorrar ancho de banda local
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    upstream nextjs_app {
        server app:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Logs de acceso y error
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Proxy para la aplicación Next.js
        location / {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tiempo de espera extendido para procesos largos de la SLLM
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }

        # Protección: Bloquear acceso directo a archivos sensibles
        location ~ /\. {
            deny all;
        }
    }
}