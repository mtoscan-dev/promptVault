services:
  # Base de Datos con pgvector y script inicial nativo
  db:
    image: ankane/pgvector:latest
    container_name: vault_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - vault_pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PORT_DB_EXTERNAL:-5433}:5432"
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-512M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vault_network

  # Motor de IA Local (DISABLED - Using Host Machine for GPU)
  # ollama:
  #   image: ollama/ollama
  #   container_name: vault_ai
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   ports:
  #     - "${OLLAMA_PORT}:11434"
  #   environment:
  #     - OLLAMA_KEEP_ALIVE=30m
  #   networks:
  #     - vault_network

  # Aplicación Next.js (Standalone Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vault_app
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      OLLAMA_HOST: ${OLLAMA_HOST}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen2.5:3b}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-qwen2.5:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT_APP_EXTERNAL:-3080}:3000"
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-1G}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vault_network

  # Drizzle Studio (Database GUI)
  studio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vault_studio
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    ports:
      - "${PORT_STUDIO:-4984}:4984"
    command: pnpm drizzle-kit studio --port 4984 --host 0.0.0.0 --config drizzle.config.ts
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vault_network

  # Gateway Nginx
  nginx:
    image: nginx:alpine
    container_name: vault_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - vault_network

volumes:
  vault_pgdata:

networks:
  vault_network:
    driver: bridge
