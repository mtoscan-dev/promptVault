# Override para desarrollo (se carga automáticamente con `docker compose up`)
# Para producción usar: docker compose -f docker-compose.yaml up
services:
  app:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - vault_app_modules:/app/node_modules
      - vault_app_next:/app/.next

volumes:
  vault_app_modules:
  vault_app_next:
